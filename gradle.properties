# Heartstead build configuration
# All versions verified 2026-07-31 — see docs/REFERENCES.md before changing any of them.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ is not yet fully compatible with the configuration cache (FabricMC/fabric-loom#1349)
org.gradle.configuration-cache=false

# --- Minecraft ---
# 26.2 released 2026-06-16 and requires Java 25 (java-runtime-epsilon).
minecraft_version=26.2
java_version=25

# --- Mappings: NONE, and none are possible ---
# Minecraft 26.1 was the first UNOBFUSCATED release, so there is nothing to map.
# Mojang stopped publishing official mappings after 1.21.11, Yarn stopped at the same
# version, and Fabric's intermediary for 26.x is the placeholder 0.0.0.
# Do not add a mappings property of any kind. See docs/REFERENCES.md.

# --- Fabric ---
loader_version=0.19.3
fabric_version=0.156.0+26.2
loom_version=1.17.17

# --- Mod ---
mod_version=0.1.0
maven_group=com.heartstead
archives_base_name=heartstead

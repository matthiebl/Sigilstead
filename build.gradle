plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

version = "${mod_version}+${minecraft_version}"
group = project.maven_group
base.archivesName = project.archives_base_name

// Split source sets: anything touching rendering, screens or keybinds lives in src/client
// and is never loaded on a dedicated server. See docs/CONVENTIONS.md §3.
loom {
    splitEnvironmentSourceSets()

    mods {
        "heartstead" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        // Headless GameTest run — this is what makes the mod self-verifying.
        // ./gradlew runGametest
        gametest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
            runDir "build/gametest"
        }
    }
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Yarn has no 26.x mappings (newest is 1.21.11), so we use Mojang's official
    // mappings. Note these carry Mojang's mappings licence — fine for a public mod,
    // but read it before relicensing or vendoring. See docs/REFERENCES.md.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
    it.options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'minecraft_version': project.minecraft_version,
               'loader_version': project.loader_version
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

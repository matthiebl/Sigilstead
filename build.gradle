plugins {
    // MUST be the fully-qualified id. The bare 'fabric-loom' resolves to the legacy
    // *remapping* plugin, which demands a `mappings` dependency that does not exist for
    // unobfuscated 26.x. See docs/REFERENCES.md.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = "${mod_version}+${minecraft_version}"
group = project.maven_group
base.archivesName = project.archives_base_name

// Split source sets: anything touching rendering, screens or keybinds lives in src/client
// and is never loaded on a dedicated server. See docs/CONVENTIONS.md §3.
loom {
    splitEnvironmentSourceSets()

    mods {
        "heartstead" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        // Headless GameTest run — this is what makes the mod self-verifying.
        // ./gradlew runGametest
        gametest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
            runDir "build/gametest"
        }
    }
}

repositories {
    // Loom adds the Minecraft and Fabric repositories automatically.
    // Only add entries here for third-party mod dependencies.
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // NO mappings dependency, on purpose.
    //
    // 26.1 was the first unobfuscated Minecraft release, so there is nothing to map:
    // Mojang stopped publishing official mappings after 1.21.11, Yarn stopped at the
    // same version, and Fabric's intermediary for 26.x is the placeholder 0.0.0.
    //
    // Consequently nothing is remapped either — plain `implementation`, not
    // `modImplementation`; plain `jar`, not `remapJar`. See docs/REFERENCES.md.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
    it.options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'minecraft_version': project.minecraft_version,
               'loader_version': project.loader_version
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
